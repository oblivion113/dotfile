# Dotfiles sync manifest.
#
# Each [[entry]] maps one device file to one repo file:
#   name     unique handle, used to select entries on the CLI
#   platform macos | wsl | all   ("all" applies on every platform)
#   mode     link | copy
#     link — the device path is a symlink into the repo; the repo is the single
#            source of truth and edits go live immediately
#     copy — two real files; sync explicitly with `push` (device -> repo)
#            or `pull` (repo -> device)
#   source   path relative to the repo root; may go stale after restructuring,
#            repair it with `sync.py refresh`
#   target   absolute path on the device (~ is expanded); this is the stable
#            identity of an entry — device locations rarely change

# --- pi harness -------------------------------------------------------------

[[entry]]
name = "agents-md"
platform = "macos"
mode = "link"
source = "sysprompt/macos/AGENTS.md"
target = "~/.pi/agent/AGENTS.md"

